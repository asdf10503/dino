<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="跑酷：在霓虹未來城市中奔跑、跳躍與閃避障礙。">
  <title>跑酷</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="game-section" id="game" aria-label="跑酷遊戲">
      <div class="section-heading">
        <h1>跑酷</h1>
      </div>

      <div class="game-frame">
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="800" height="300" aria-label="跑酷遊戲畫面" role="img">
            您的瀏覽器不支援 Canvas 畫布。
          </canvas>

          <div class="scoreboard" aria-live="polite">
            <div><span>分數</span><strong id="score-value">000000</strong></div>
            <div><span>最高</span><strong id="high-score-value">000000</strong></div>
          </div>

          <section class="game-overlay start-overlay" id="start-overlay" aria-labelledby="start-title">
            <div class="overlay-panel">
              <p class="overlay-kicker">準備好了嗎？</p>
              <h2 id="start-title">跑酷</h2>
              <p class="overlay-copy">空白鍵跳躍・↓ 下蹲・→ 射擊・空白鍵連按二段跳</p>
              <p class="start-prompt"><span class="prompt-key">空白鍵</span> 開始遊戲 <span class="prompt-line"></span></p>
            </div>
          </section>

          <section class="game-overlay gameover-overlay is-hidden" id="gameover-overlay" aria-labelledby="gameover-title" aria-hidden="true">
            <div class="overlay-panel gameover-panel">
              <p class="overlay-kicker danger-kicker">任務結束</p>
              <svg class="dead-food" viewBox="0 0 120 80" role="img" aria-label="盤子上的豬腳">
                <ellipse cx="60" cy="66" rx="47" ry="10" fill="#d8e2eb"/>
                <ellipse cx="60" cy="63" rx="47" ry="10" fill="#f7f9fc" stroke="#a9bed0" stroke-width="2"/>
                <ellipse cx="60" cy="63" rx="37" ry="6" fill="none" stroke="#d4e1eb" stroke-width="2"/>
                <path d="M43 48 25 34" fill="none" stroke="#f4e4d5" stroke-linecap="round" stroke-width="9"/>
                <circle cx="22" cy="31" r="6" fill="#fff3e6"/>
                <circle cx="29" cy="36" r="6" fill="#fff3e6"/>
                <path d="M41 45c-4-15 6-26 19-23 14-5 25 7 21 20-2 12-14 19-27 16-7-1-11-6-13-13Z" fill="#d76b70" stroke="#9e404b" stroke-width="2"/>
                <path d="M52 31c6-5 12-5 17-2" fill="none" stroke="#f4a39a" stroke-linecap="round" stroke-width="3"/>
              </svg>
              <h2 id="gameover-title">豬腳上桌</h2>
              <div class="result-line"><span>本次分數</span><strong id="final-score">000000</strong></div>
              <button class="restart-button" id="restart-button" type="button"><span aria-hidden="true">↻</span> 重新開始</button>
            </div>
          </section>
        </div>
      </div>

      <div class="play-controls" aria-label="觸控操作">
        <button class="touch-button jump-button" id="touch-jump" type="button"><span aria-hidden="true">↑</span> 跳躍</button>
        <button class="touch-button duck-button" id="touch-duck" type="button"><span aria-hidden="true">↓</span> 下蹲</button>
        <button class="touch-button shoot-button" id="touch-shoot" type="button"><span aria-hidden="true">→</span> 射擊</button>
      </div>
    </section>
  </main>
</body>
</html>
