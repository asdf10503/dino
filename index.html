<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="跑酷：在霓虹未來城市中奔跑、跳躍與閃避障礙。">
  <title>跑酷</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <a class="brand" href="#game" aria-label="跑酷首頁">
        <span class="brand-mark" aria-hidden="true">跑</span>
        <span class="brand-name">跑<b>酷</b></span>
      </a>
      <div class="system-status"><span class="status-light"></span> 城市連線 <b>在線</b></div>
    </header>

    <section class="game-section" id="game" aria-label="跑酷遊戲">
      <div class="section-heading">
        <div>
          <p class="eyebrow">無盡都會 / 第 08 區</p>
          <h1>跑酷</h1>
        </div>
        <div class="build-tag">街機 <i>///</i> 01</div>
      </div>

      <div class="game-frame">
        <div class="game-topline" aria-hidden="true">
          <span><i></i> 即時訊號</span>
          <span>新都會 // 2096</span>
          <span>系統 <b>00:08</b></span>
        </div>
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="800" height="300" aria-label="跑酷遊戲畫面" role="img">
            您的瀏覽器不支援 Canvas 畫布。
          </canvas>
          <div class="scan-overlay" aria-hidden="true"></div>

          <div class="scoreboard" aria-live="polite">
            <div><span>分數</span><strong id="score-value">000000</strong></div>
            <div><span>最高</span><strong id="high-score-value">000000</strong></div>
          </div>

          <section class="game-overlay start-overlay" id="start-overlay" aria-labelledby="start-title">
            <div class="overlay-panel">
              <p class="overlay-kicker"><span></span> 系統就緒</p>
              <h2 id="start-title">跑酷</h2>
              <p class="overlay-copy">穿梭電光城市，避開迎面而來的訊號障礙。</p>
              <div class="control-guide" aria-label="操作說明">
                <p class="guide-label">電腦操作 <span>玩家 01</span></p>
                <div class="control-row"><kbd>空白鍵</kbd><span>跳躍</span></div>
                <div class="control-row"><kbd>↓</kbd><span>下蹲</span></div>
                <div class="control-row"><kbd>→</kbd><span>射擊</span></div>
                <div class="control-row"><kbd>空白鍵 × 2</kbd><span>二段跳</span></div>
              </div>
              <p class="start-prompt"><span class="prompt-key">空白鍵</span> 開始遊戲 <span class="prompt-line"></span></p>
            </div>
          </section>

          <section class="game-overlay gameover-overlay is-hidden" id="gameover-overlay" aria-labelledby="gameover-title" aria-hidden="true">
            <div class="overlay-panel gameover-panel">
              <p class="overlay-kicker danger-kicker"><span></span> 任務結束</p>
              <h2 id="gameover-title">死亡</h2>
              <div class="result-line"><span>本次分數</span><strong id="final-score">000000</strong></div>
              <div class="result-line"><span>最高紀錄</span><strong id="final-high-score">000000</strong></div>
              <button class="restart-button" id="restart-button" type="button"><span aria-hidden="true">↻</span> 重新開始</button>
              <p class="start-prompt"><span class="prompt-key">空白鍵</span> 重新開始</p>
            </div>
          </section>
        </div>
        <div class="game-bottomline" aria-hidden="true">
          <span>跑者 <b>出發</b></span>
          <span>閃避障礙 <i>•</i> 持續前進</span>
          <span>800 <i>×</i> 300</span>
        </div>
      </div>

      <div class="play-controls" aria-label="觸控操作">
        <button class="touch-button jump-button" id="touch-jump" type="button"><span aria-hidden="true">↑</span> 跳躍</button>
        <button class="touch-button duck-button" id="touch-duck" type="button"><span aria-hidden="true">↓</span> 下蹲</button>
        <button class="touch-button shoot-button" id="touch-shoot" type="button"><span aria-hidden="true">→</span> 射擊</button>
      </div>
      <p class="under-note"><span>01</span> 別停下來，這座城市不會等你。</p>
    </section>

    <footer class="page-footer">
      <span>跑酷 <b>///</b> 獨立街機遊戲</span>
      <span>保持訊號暢通。</span>
    </footer>
  </main>
</body>
</html>
